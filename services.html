<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMA Agency - Secteurs & Services</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --glass: rgba(255, 255, 255, 0.75);
            --text: #0f172a;
            --text-light: #64748b;
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --accent: #06b6d4;
            --whatsapp: #25D366;
            --border: rgba(203, 213, 225, 0.5);
            --shadow: 0 20px 50px rgba(0,0,0,0.08);
            --radius: 20px;
            --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        body.dark {
            --bg: #0f172a;
            --surface: #1e293b;
            --glass: rgba(30, 41, 59, 0.8);
            --text: #f1f5f9;
            --text-light: #94a3b8;
            --primary: #3b82f6;
            --accent: #22d3ee;
            --border: rgba(148, 163, 184, 0.2);
            --shadow: 0 20px 50px rgba(0,0,0,0.4);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html { scroll-behavior: smooth; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            transition: background 0.4s, color 0.3s;
            overflow-x: hidden;
        }
        
        .loader {
            position: fixed; inset: 0; background: var(--bg);
            display: flex; align-items: center; justify-content: center;
            z-index: 9999; transition: opacity 0.5s, visibility 0.5s;
        }
        .loader.hidden { opacity: 0; visibility: hidden; }
        .loader-ring {
            width: 60px; height: 60px;
            border: 4px solid rgba(37, 99, 235, 0.15);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .navbar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
            background: var(--glass); backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
        }
        .navbar-container {
            max-width: 1300px; margin: 0 auto;
            padding: 1rem 2rem; display: flex;
            align-items: center; justify-content: space-between;
        }
        .logo {
            display: flex; align-items: center; gap: 0.5rem;
            text-decoration: none; font-size: 1.8rem; font-weight: 800;
            background: linear-gradient(135deg, #2563eb, #06b6d4);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .nav-links {
            display: flex; gap: 2rem; align-items: center; list-style: none;
        }
        .nav-links a {
            text-decoration: none; color: var(--text);
            font-weight: 500; font-size: 0.95rem; transition: color 0.2s;
            position: relative;
        }
        .nav-links a::after {
            content: ''; position: absolute; bottom: -4px; left: 0;
            width: 0; height: 2px; background: var(--primary);
            transition: width 0.3s;
        }
        .nav-links a:hover::after, .nav-links a.active::after { width: 100%; }
        
        .btn-icon {
            background: transparent; border: 1px solid var(--border);
            border-radius: 50%; width: 42px; height: 42px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--text); transition: all 0.3s;
        }
        
        .theme-toggle .fa-sun { display: none; }
        .theme-toggle .fa-moon { display: inline; }
        body.dark .theme-toggle .fa-sun { display: inline; }
        body.dark .theme-toggle .fa-moon { display: none; }
        
        .section-padding {
            padding: 6rem 2rem 4rem;
        }
        .section-container {
            max-width: 1300px; margin: 0 auto;
        }
        .section-header {
            text-align: center; margin-bottom: 4rem;
        }
        .section-badge {
            display: inline-block; background: rgba(37, 99, 235, 0.1);
            color: var(--primary); padding: 0.4rem 1.2rem;
            border-radius: 50px; font-weight: 600; font-size: 0.9rem;
            margin-bottom: 1rem;
        }
        .section-title {
            font-size: 3rem; font-weight: 800; margin-bottom: 1rem;
        }
        .gradient-text {
            background: linear-gradient(135deg, #2563eb, #06b6d4);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .section-description {
            font-size: 1.1rem; color: var(--text-light); max-width: 600px;
            margin: 0 auto;
        }
        
        /* Cards Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }
        .card {
            background: var(--glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2rem;
            text-align: center;
            transition: all 0.35s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, #2563eb, #06b6d4);
            transform: scaleX(0);
            transition: transform 0.35s;
        }
        .card:hover::before {
            transform: scaleX(1);
        }
        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 25px 50px rgba(0,0,0,0.15);
        }
        .card-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #2563eb, #06b6d4);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .card h3 {
            font-weight: 700; margin-bottom: 0.5rem;
        }
        .card p {
            font-size: 0.9rem; color: var(--text-light);
        }
        
        .whatsapp-float {
            position: fixed; bottom: 30px; right: 30px;
            width: 60px; height: 60px; background: #25D366;
            border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-size: 1.6rem; color: white;
            text-decoration: none; z-index: 999;
            box-shadow: 0 8px 30px rgba(37, 211, 102, 0.4);
            transition: all 0.3s; animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 8px 30px rgba(37, 211, 102, 0.4); }
            50% { box-shadow: 0 8px 50px rgba(37, 211, 102, 0.7); }
        }
        .menu-toggle { display: none; flex-direction: column; gap: 5px; background: none; border: none; cursor: pointer; }
        .menu-bar { width: 25px; height: 3px; background: var(--text); border-radius: 3px; }
        
        @media (max-width: 768px) {
            .nav-links { display: none; position: absolute; top: 100%; left: 0; right: 0; background: var(--glass); backdrop-filter: blur(20px); flex-direction: column; padding: 2rem; }
            .nav-links.active { display: flex; }
            .menu-toggle { display: flex; }
            .section-title { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <div class="loader" id="loader"><div class="loader-ring"></div></div>
    
    <nav class="navbar">
        <div class="navbar-container">
            <a href="index.html" class="logo"><i class="fas fa-bolt"></i> SMA</a>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Accueil</a></li>
                <li><a href="services.html" class="active">Services</a></li>
                <li><a href="configurateur.html">Configurateur</a></li>
                <li><a href="equipe.html">Équipe</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <div style="display:flex;align-items:center;gap:1rem;">
                <button class="btn-icon theme-toggle" id="themeToggle">
                    <i class="fas fa-sun"></i><i class="fas fa-moon"></i>
                </button>
                <button class="menu-toggle" id="menuToggle">
                    <span class="menu-bar"></span><span class="menu-bar"></span><span class="menu-bar"></span>
                </button>
            </div>
        </div>
    </nav>
    
    <!-- Secteurs -->
    <section class="section-padding" style="padding-top: 7rem;">
        <div class="section-container">
            <div class="section-header">
                <span class="section-badge">Expertise</span>
                <h2 class="section-title">Des solutions pour <span class="gradient-text">chaque secteur</span></h2>
                <p class="section-description">Nous comprenons les spécificités de votre domaine.</p>
            </div>
            <div class="cards-grid" id="secteursGrid"></div>
        </div>
    </section>
    
    <!-- Services -->
    <section class="section-padding">
        <div class="section-container">
            <div class="section-header">
                <span class="section-badge">Services</span>
                <h2 class="section-title">Ce que nous <span class="gradient-text">proposons</span></h2>
                <p class="section-description">Une gamme complète pour votre transformation digitale.</p>
            </div>
            <div class="cards-grid" id="servicesGrid"></div>
        </div>
        <div style="text-align:center;margin-top:3rem;">
            <a href="configurateur.html" class="btn btn-primary">
                <i class="fab fa-whatsapp"></i> Configurer mon projet
            </a>
        </div>
    </section>
    
    <a href="https://wa.me/243123456789" class="whatsapp-float" target="_blank"><i class="fab fa-whatsapp"></i></a>
    
    <script src="js/app.js"></script>
</body>
</html>
