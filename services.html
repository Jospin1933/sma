    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --glass: rgba(255, 255, 255, 0.75);
            --text: #0f172a;
            --text-light: #64748b;
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --accent: #06b6d4;
            --whatsapp: #25D366;
            --border: rgba(203, 213, 225, 0.5);
            --shadow: 0 20px 50px rgba(0,0,0,0.08);
            --radius: 20px;
            --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        body.dark {
            --bg: #0f172a;
            --surface: #1e293b;
            --glass: rgba(30, 41, 59, 0.8);
            --text: #f1f5f9;
            --text-light: #94a3b8;
            --primary: #3b82f6;
            --accent: #22d3ee;
            --border: rgba(148, 163, 184, 0.2);
            --shadow: 0 20px 50px rgba(0,0,0,0.4);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            transition: background 0.4s, color 0.3s;
            overflow-x: hidden;
        }

        /* ==================== LOGO LOADER ==================== */
        .logo-loader-overlay { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 99999; transition: opacity 0.6s ease, visibility 0.6s ease; }
        .logo-loader-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .logo-loader-container { display: flex; flex-direction: column; align-items: center; gap: 2rem; }
        .logo-loader-wrapper { position: relative; display: flex; align-items: center; justify-content: center; }
        .logo-loader-ring { width: 150px; height: 150px; position: absolute; border: 3px solid transparent; border-top: 3px solid var(--primary); border-right: 3px solid var(--accent); border-radius: 50%; animation: ringSpin 1.2s linear infinite; }
        @keyframes ringSpin { to { transform: rotate(360deg); } }
        .logo-loader-image { width: 100px; height: 100px; object-fit: contain; z-index: 2; animation: logoPulse 1.4s ease-in-out infinite, logoFloat 2.5s ease-in-out infinite; }
        @keyframes logoPulse { 0%, 100% { transform: scale(1); filter: drop-shadow(0 0 20px rgba(37, 99, 235, 0.3)); } 50% { transform: scale(1.08); filter: drop-shadow(0 0 40px rgba(37, 99, 235, 0.6)); } }
        @keyframes logoFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
        .logo-loader-text { font-size: 2rem; font-weight: 800; letter-spacing: 4px; background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo-loader-dots { display: flex; gap: 8px; }
        .logo-loader-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); animation: dotBounce 1.2s ease-in-out infinite; }
        .logo-loader-dot:nth-child(2) { animation-delay: 0.2s; background: var(--accent); }
        .logo-loader-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dotBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-16px); } }

        /* ==================== NAVBAR ==================== */
        .navbar { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); height: 70px; }
        .navbar.scrolled { box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .navbar-container { max-width: 1300px; margin: 0 auto; padding: 0 2rem; height: 100%; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
        
        .logo { display: flex; align-items: center; gap: 0.5rem; text-decoration: none; transition: transform var(--transition); flex-shrink: 0; }
        .logo:hover { transform: scale(1.03); }
        .logo img { width: 40px; height: 40px; object-fit: contain; }
        .logo span { font-size: 1.5rem; font-weight: 800; background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .nav-links { display: flex; gap: 1.8rem; align-items: center; list-style: none; }
        .nav-links a { text-decoration: none; color: var(--text); font-weight: 500; font-size: 0.92rem; transition: color 0.2s; position: relative; padding: 0.3rem 0; white-space: nowrap; }
        .nav-links a::after { content: ''; position: absolute; bottom: -4px; left: 0; width: 0; height: 2px; background: var(--primary); border-radius: 10px; transition: width 0.3s; }
        .nav-links a:hover::after, .nav-links a.active::after { width: 100%; }

        .navbar-actions-group { display: flex; align-items: center; gap: 0.6rem; flex-shrink: 0; }
        
        .btn-icon { background: transparent; border: 1.5px solid var(--border); border-radius: 50%; width: 40px; height: 40px; min-width: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text); transition: all 0.3s; }
        .btn-icon:hover { border-color: var(--primary); color: var(--primary); }
        
        .theme-toggle .fa-moon { display: inline; }
        .theme-toggle .fa-sun { display: none; }
        body.dark .theme-toggle .fa-moon { display: none; }
        body.dark .theme-toggle .fa-sun { display: inline; }

        /* ==================== BOUTON LANGUE ==================== */
        .lang-toggle { background: transparent; border: 1.5px solid var(--border); border-radius: 50px; padding: 0.4rem 0.8rem; display: flex; align-items: center; gap: 0.3rem; cursor: pointer; color: var(--text); font-weight: 600; font-size: 0.82rem; transition: all 0.3s; white-space: nowrap; }
        .lang-toggle:hover { background: var(--surface); border-color: var(--primary); color: var(--primary); }

        .btn { display: inline-flex; align-items: center; gap: 0.45rem; padding: 0.65rem 1.4rem; border-radius: 50px; font-weight: 600; font-size: 0.9rem; text-decoration: none; cursor: pointer; border: none; transition: all 0.3s; white-space: nowrap; font-family: 'Inter', sans-serif; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); transform: translateY(-2px); box-shadow: 0 10px 30px rgba(37, 99, 235, 0.3); }
        .btn-whatsapp { background: var(--whatsapp); color: white; }
        .btn-whatsapp:hover { background: #128C7E; transform: translateY(-2px); box-shadow: 0 10px 30px rgba(37, 211, 102, 0.3); }
        .btn-lg { padding: 0.9rem 2rem; font-size: 1rem; }
        
        .menu-burger { display: none; flex-direction: column; gap: 4px; background: none; border: none; cursor: pointer; padding: 6px; width: 40px; height: 40px; align-items: center; justify-content: center; }
        .menu-burger span { width: 24px; height: 2.5px; background: var(--text); border-radius: 3px; transition: all 0.3s; }
        .menu-burger.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
        .menu-burger.active span:nth-child(2) { opacity: 0; }
        .menu-burger.active span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }
        
        /* ==================== SECTIONS ==================== */
        .section-padding { padding: 7rem 2rem 4rem; }
        .section-container { max-width: 1300px; margin: 0 auto; }
        .section-header { text-align: center; margin-bottom: 4rem; }
        .section-badge { display: inline-block; background: rgba(37, 99, 235, 0.1); color: var(--primary); padding: 0.4rem 1.2rem; border-radius: 50px; font-weight: 600; font-size: 0.9rem; margin-bottom: 1rem; }
        .section-title { font-size: 3rem; font-weight: 800; margin-bottom: 1rem; }
        .gradient-text { background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .section-description { font-size: 1.1rem; color: var(--text-light); max-width: 600px; margin: 0 auto; }
        
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1.5rem; }
        .card { background: var(--glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--border); border-radius: var(--radius); padding: 2rem; text-align: center; transition: all 0.35s; cursor: pointer; position: relative; overflow: hidden; }
        .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, var(--primary), var(--accent)); transform: scaleX(0); transition: transform 0.35s; }
        .card:hover::before { transform: scaleX(1); }
        .card:hover { transform: translateY(-10px); box-shadow: 0 25px 50px rgba(0,0,0,0.15); }
        .card-icon { font-size: 2.5rem; margin-bottom: 1rem; background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .card h3 { font-weight: 700; margin-bottom: 0.5rem; }
        .card p { font-size: 0.9rem; color: var(--text-light); }
        
        .whatsapp-float { position: fixed; bottom: 28px; right: 28px; width: 58px; height: 58px; background: #25D366; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; color: white; text-decoration: none; z-index: 999; box-shadow: 0 8px 32px rgba(37, 211, 102, 0.4); transition: all 0.3s; animation: floatPulse 2.5s ease-in-out infinite; }
        .whatsapp-float:hover { transform: scale(1.12); }
        @keyframes floatPulse { 0%, 100% { box-shadow: 0 8px 32px rgba(37, 211, 102, 0.4); } 50% { box-shadow: 0 8px 55px rgba(37, 211, 102, 0.7); } }
        
        .reveal { opacity: 0; transform: translateY(40px); transition: opacity 0.8s ease, transform 0.8s ease; }
        .reveal.visible { opacity: 1; transform: translateY(0); }
        .stagger-1 { transition-delay: 0.05s; } .stagger-2 { transition-delay: 0.1s; }
        .stagger-3 { transition-delay: 0.15s; } .stagger-4 { transition-delay: 0.2s; }
        .stagger-5 { transition-delay: 0.25s; } .stagger-6 { transition-delay: 0.3s; }
        .stagger-7 { transition-delay: 0.35s; } .stagger-8 { transition-delay: 0.4s; }
        
        @media (max-width: 768px) {
            .navbar-container { padding: 0 1rem; }
            .logo img { width: 34px; height: 34px; }
            .logo span { font-size: 1.3rem; }
            .nav-links { display: none; position: fixed; top: 70px; left: 0; right: 0; background: var(--glass); backdrop-filter: blur(20px); flex-direction: column; padding: 1.5rem; gap: 1rem; border-bottom: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.1); z-index: 999; }
            .nav-links.active { display: flex; }
            .menu-burger { display: flex; }
            .navbar-container { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 0.5rem; }
            .logo { justify-self: center; }
            .navbar-actions-group { justify-self: end; }
            .section-title { font-size: 2rem; }
            .section-padding { padding: 5rem 1rem 2rem; }
            .cards-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1rem; }
            .card { padding: 1.5rem 1rem; }
            .card-icon { font-size: 2rem; }
            .card h3 { font-size: 1rem; }
            .card p { font-size: 0.8rem; }
            .whatsapp-float { width: 50px; height: 50px; font-size: 1.4rem; bottom: 18px; right: 18px; }
        }
    </style>
</head>
<body>

    <!-- ==================== LOGO LOADER ==================== -->
    <div class="logo-loader-overlay" id="logoLoader">
        <div class="logo-loader-container">

            </div>
        </div>
    </div>
    
    <!-- ==================== NAVBAR ==================== -->
    <nav class="navbar" id="navbar">
        <div class="navbar-container">
            <a href="index.html" class="logo">
                <img src="images/logo.png" alt="SMA Logo">
                <span>SMA</span>
            </a>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Accueil</a></li>
                <li><a href="services.html" class="active">Services</a></li>
                <li><a href="configurateur.html">Configurateur</a></li>

                <!-- Bouton Langue -->

                <button class="menu-burger" id="menuBurger" aria-label="Menu">

                </button>

    </nav>
    
    <!-- ==================== SECTEURS ==================== -->
    <section class="section-padding" style="padding-top: 7rem;">
        <div class="section-container">
            <div class="section-header reveal">
                <span class="section-badge" data-fr="Expertise" data-en="Expertise">Expertise</span>
                <h2 class="section-title"><span data-fr="Des solutions pour " data-en="Solutions for ">Des solutions pour </span><span class="gradient-text" data-fr="chaque secteur" data-en="every sector">chaque secteur</span></h2>
                <p class="section-description" data-fr="Nous comprenons les spécificités de votre domaine." data-en="We understand the specifics of your field.">Nous comprenons les spécificités de votre domaine.</p>
            </div>

        </div>
    </section>
    
    <!-- ==================== SERVICES ==================== -->
    <section class="section-padding">
        <div class="section-container">
            <div class="section-header reveal">
                <span class="section-badge" data-fr="Services" data-en="Services">Services</span>
                <h2 class="section-title"><span data-fr="Ce que nous " data-en="What we ">Ce que nous </span><span class="gradient-text" data-fr="proposons" data-en="offer">proposons</span></h2>
                <p class="section-description" data-fr="Une gamme complète pour votre transformation digitale." data-en="A complete range for your digital transformation.">Une gamme complète pour votre transformation digitale.</p>
            </div>
            <div class="cards-grid" id="servicesGrid"></div>
        </div>
        <div style="text-align:center;margin-top:3rem;">
            <a href="configurateur.html" class="btn btn-whatsapp btn-lg reveal">
                <i class="fab fa-whatsapp"></i> <span data-fr="Configurer mon projet" data-en="Configure my project">Configurer mon projet</span>
            </a>
        </div>
    </section>
    
    <!-- ==================== WHATSAPP FLOAT ==================== -->
    <a href="https://wa.me/243844464423" class="whatsapp-float" target="_blank"><i class="fab fa-whatsapp"></i></a>
    
    <script>
        (function(){'use strict';

        // ==================== LANGUE ====================
        let currentLang = localStorage.getItem('sma-lang') || 'fr';
        
        function applyLanguage(lang) {
            document.querySelectorAll('[data-fr][data-en]').forEach(el => {
                el.textContent = el.getAttribute('data-' + lang);
            });
            const langToggle = document.getElementById('langToggle');
            if (langToggle) {
                const flag = lang === 'fr' ? '🇫🇷' : '🇬🇧';
                const code = lang === 'fr' ? 'FR' : 'EN';
                langToggle.querySelector('span:first-child').textContent = flag;
                langToggle.querySelector('span:last-child').textContent = code;
            }
            document.documentElement.lang = lang;
            localStorage.setItem('sma-lang', lang);
            currentLang = lang;
        }
        
        applyLanguage(currentLang);
        
        document.getElementById('langToggle')?.addEventListener('click', () => {
            applyLanguage(currentLang === 'fr' ? 'en' : 'fr');
        });

        // ==================== LOGO LOADER ====================
        const loader = document.getElementById('logoLoader');
        if(loader){window.addEventListener('load',()=>{setTimeout(()=>{loader.classList.add('hidden');setTimeout(()=>loader.remove(),700)},1800)});setTimeout(()=>{if(loader&&!loader.classList.contains('hidden')){loader.classList.add('hidden');setTimeout(()=>loader.remove(),700)}},5000)}

        // ==================== DARK MODE ====================
        const tt = document.getElementById('themeToggle');
        if(localStorage.getItem('sma-dark-mode')==='true')document.body.classList.add('dark');
        tt?.addEventListener('click',()=>{document.body.classList.toggle('dark');localStorage.setItem('sma-dark-mode',document.body.classList.contains('dark'))});

        // ==================== MOBILE MENU ====================
        const burger = document.getElementById('menuBurger'), nl = document.getElementById('navLinks');
        burger?.addEventListener('click',()=>{burger.classList.toggle('active');nl.classList.toggle('active')});
        nl?.querySelectorAll('a').forEach(l=>l.addEventListener('click',()=>{burger.classList.remove('active');nl.classList.remove('active')}));
        window.addEventListener('scroll',()=>document.getElementById('navbar')?.classList.toggle('scrolled',window.scrollY>50));

        // ==================== POPULATE CONTENT ====================
        const secteurs = [
            { name:'Écoles & Universités', icon:'fa-graduation-cap', desc:'Plateformes e-learning intelligentes' },
            { name:'Magasins & E-commerce', icon:'fa-store', desc:'Boutiques en ligne performantes' },
            { name:'PME & Startups', icon:'fa-rocket', desc:'Sites vitrine, branding complet' },
            { name:'ONG & Associations', icon:'fa-hand-holding-heart', desc:'Visibilité, collecte de dons' },
            { name:'Hôtels & Restaurants', icon:'fa-hotel', desc:'Réservation en ligne, menus digitaux' },
            { name:'Hôpitaux & Cliniques', icon:'fa-hospital', desc:'RDV en ligne, information patient' },
            { name:'Industrie Minière', icon:'fa-gem', desc:'Communication corporate digitale' },
            { name:'Autres secteurs', icon:'fa-building', desc:'Solution sur mesure' }
        ];
        const services = [
            { name:'Création Sites Web', icon:'fa-globe', desc:'Sites vitrine, e-commerce, institutionnels' },
            { name:'Applications Web', icon:'fa-mobile-screen', desc:'PWAs, dashboards, outils métier' },
            { name:'Automatisation', icon:'fa-robot', desc:'Chatbots, workflows, CRM intelligents' },
            { name:'Marketing Digital', icon:'fa-bullhorn', desc:'SEO, SEA, réseaux sociaux' },
            { name:'Branding & Design', icon:'fa-palette', desc:'Logo, charte graphique complète' },
            { name:'Community Management', icon:'fa-comments', desc:'Contenu engageant, veille' }
        ];

        document.getElementById('secteursGrid').innerHTML = secteurs.map((s,i)=>`<div class="card reveal stagger-${i+1}"><div class="card-icon"><i class="fas ${s.icon}"></i></div><h3>${s.name}</h3><p>${s.desc}</p></div>`).join('');
        document.getElementById('servicesGrid').innerHTML = services.map((s,i)=>`<div class="card reveal stagger-${i+1}"><div class="card-icon"><i class="fas ${s.icon}"></i></div><h3>${s.name}</h3><p>${s.desc}</p></div>`).join('');

        // ==================== SCROLL REVEAL ====================
        const obs = new IntersectionObserver(e=>{e.forEach(en=>{if(en.isIntersecting)en.target.classList.add('visible')})},{threshold:0.1,rootMargin:'0px 0px -50px 0px'});
        document.querySelectorAll('.reveal').forEach(el=>obs.observe(el));

        console.log('🚀 SMA Agency - Services prêt !');
        })();
    </script>
</body>
